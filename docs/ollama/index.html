<!DOCTYPE html>
<html lang="zh-Hant">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<script src="https://porshenlai.github.io/App/js/marked.min.js"></script>
	<script>
		window.MathJax={tex:{inlineMath: [['$', '$'], ['\\(', '\\)']],displayMath: [['$$', '$$'], ['\\[', '\\]']]}};
	</script>
	<script src="https://porshenlai.github.io/App/js/tex-mml-chtml.js"></script>
	<script id='piers' src="https://porshenlai.github.io/App/piers.js"></script>
</head><body style='padding:1%'>
<div>
<div>
	<textarea rows='3' style='width:100%;font-size:100%;'>Hello, I'm Porshen Lai. Nice to meet you.</textarea>
	<div style='text-align:right'>
		<select style='font-size:100%;'><option value='-1'>歷史紀錄</option></select>
		<button style='font-size:100%;'>&dArr;</button>
	</div>
	<div id='Response' style='border:1px solid black; padding:8px;'></div>
</div>
<script>
	function initChatUI (Apps, Ask, History, Quest, Reply) {
		const D = {
			API: 'http://localhost:8080/__API__/ollama/request',
			Request: "", Response: "", History: []
		};	// Dataset
		History.addEventListener("change",async (event) => {
			const [req,res] = D.History[event.target.value];
			Quest.value=req;
			Reply.innerHTML = window.marked.parse(res);
			event.target.value='-1'
		});	// addEventListener(change)
		Ask.addEventListener("click",async (event) => {
			let RQ = { "Q" : (D.Request = Quest.value) };
			if (D.ID) RQ.I = D.ID;

			// sync generating responses
			let R = Apps.D({});
			await R.fetch(D.API, {
				"method": "POST",
				"headers": { "Content-Type": "application/json" },
				"body": JSON.stringify(RQ)
			});
			R = R.D;

			if (R.I) {
				D.ID = R.I;
				D.Since = Math.floor((new Date().getTime())/1000);
				Ask.disabled = true;
				let timer = setInterval(async () => {
					const tc=Math.floor((new Date()).getTime()/1000)-parseInt(D.Since);
					Ask.innerHTML=`&dArr;(${tc})`;
					if (tc%2==1) return;

					// sync
					let R=Apps.D({});
					await R.fetch(D.API, {
						"method": "POST",
						"headers": { "Content-Type": "application/json" },
						"body": JSON.stringify({ "I":D.ID })
					});
					R = R.D;

					if (D.Response!==R.R)
						Reply.innerHTML = window.marked.parse(D.Response=R.R);

					if (R.S!=='generating') {
						D.History.push([D.Request,D.Response]);
						History.innerHTML=D.History.reduce((r,v,i)=>{
							return r+`<option value="${i}">${v[0]}</option>`;
						},History.querySelector('option').outerHTML);
						setTimeout(()=>window.MathJax.typeset([Reply]),0);
						Ask.disabled = false;
						clearInterval(timer);
					}
				},1000);
			}	// if SID available
		}); // addEventListener(click)
	}	// initChatUI

	const Root=document.currentScript.parentNode;
	initChatUI(
		document.head.querySelector('script#piers').value, // Apps
		Root.querySelector('button'), // Ask
		Root.querySelector('select'), // History
		Root.querySelector('textarea'), // Quest
		Root.querySelector('#Response') // Reply
	);
</script>
</div>
</body></html>
